spring.application.name=seorang

# mysql
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# jpa
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.hibernate.ddl-auto=update

# jwt
#app.jwt.issuer=
#app.jwt.secret=
app.jwt.access-exp-min=15
app.jwt.refresh-exp-day=14
jwt.secret=change-this-to-a-very-long-random-secret-at-least-256-bits
jwt.access-exp-millis=900000
jwt.refresh-exp-millis=604800000

# redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=1000
spring.cache.type=redis

# S3
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# Maximum size allowed for each individual uploaded file
spring.servlet.multipart.max-file-size=50MB
# Maximum total size allowed for a single multipart/form-data request (including all files and form data)
spring.servlet.multipart.max-request-size=50MB

